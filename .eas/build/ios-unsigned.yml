build:
  name: Build unsigned iPhone IPA
  steps:
    - eas/checkout
    - eas/install_node_modules
    - eas/prebuild
    - run:
        name: Compile for iPhone and package unsigned IPA
        command: node scripts/build-ios-unsigned.cjs
    - eas/upload_artifact:
        name: Download unsigned IPA for personal signing
        inputs:
          type: application-archive
          path: build/ios-unsigned/app.ipa
