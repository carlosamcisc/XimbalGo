# Publica en GitHub Pages la página donde el familiar ve la ubicación
# compartida del cliente (web/compartir/). Ver docs/cliente-compartir-ubicacion.md.
name: Página de ubicación compartida

on:
  push:
    branches: [master]
    paths: ["web/**", ".github/workflows/pagina-ubicacion.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Escribir la URL y la key publicable de Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Faltan los secrets SUPABASE_URL y SUPABASE_PUBLISHABLE_KEY del repositorio." >&2
            exit 1
          fi
          sed -i \
            -e "s|__SUPABASE_URL__|${SUPABASE_URL}|" \
            -e "s|__SUPABASE_PUBLISHABLE_KEY__|${SUPABASE_PUBLISHABLE_KEY}|" \
            web/compartir/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: despliegue
        uses: actions/deploy-pages@v4
